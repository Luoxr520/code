# SelfEvolvingRecognition local package metadata.
# The public CLI entry is `ser`; the internal package name remains stable so
# existing modules and imports continue to work.

[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

# Project settings -----------------------------------------------------------------------------------------------------
[project]
name = "self-evolving-recognition"
dynamic = ["version"]
description = "Self-evolving YOLO recognition system with online training, model registry, and hot-swap inference"
readme = "README.md"
requires-python = ">=3.11"
license = { "text" = "GPLv3" }
keywords = ["machine-learning", "deep-learning", "computer-vision", "auto-labeling", "image-annotation", "online-training", "model-registry", "hot-swap", "YOLO"]
authors = [
    { name = "Luoxr520" },
]
maintainers = [
    { name = "Luoxr520" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

# Core dependencies
# Note: onnx and onnxruntime are in optional-dependencies for version compatibility
dependencies = [
    "natsort>=8.1.0",
    "pillow>=7.1.2",
    "pillow-heif>=0.18.0",
    "opencv-contrib-python-headless>=4.7.0.72",
    "PyQt6>=6.6.0,<6.10.0; sys_platform == 'linux'",
    "PyQt6>=6.6.0; sys_platform != 'linux'",
    "PyQt6-WebEngine>=6.6.0,<6.10.0; sys_platform == 'linux'",
    "PyQt6-WebEngine>=6.6.0; sys_platform != 'linux'",
    "qimage2ndarray>=1.10.0",
    "lapx>=0.5.5",
    "tqdm>=4.64.0",
    "scipy>=1.4.1",
    "PyYAML",
    "importlib_metadata",
    "json_repair",
    "jsonlines",
    "markdown",
    "openai",
    "psutil",
    "pyclipper",
    "six",
    "shapely",
    "termcolor",
    "tokenizers",
    "requests",
    "darkdetect>=0.8.0",
    "matplotlib",
]

# Optional dependencies ------------------------------------------------------------------------------------------------
[project.optional-dependencies]

dev = [
    "build",
    "black",
    "flake8",
    "pyinstaller",
    "pytest",
    "PySide6>=6.6.0,<6.10.0; sys_platform == 'linux'",
    "PySide6>=6.6.0; sys_platform != 'linux'",
    "twine",
]

# CPU version: Latest ONNX + ONNXRuntime
cpu = [
    "numpy>=2.0.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.15.0",
]
# CUDA 12.x: Latest ONNX + ONNXRuntime GPU (>= 1.18.1 for CUDA 12.x support)
gpu = [
    "numpy>=2.0.0",
    "onnx>=1.15.0",
    "onnxruntime-gpu>=1.18.1; platform_system != 'Darwin'",
]
# CUDA 11.x: ONNX < 1.16.1 + ONNXRuntime GPU < 1.19
gpu-cu11 = [
    "numpy<2.0.0",
    "onnx>=1.15.0,<1.16.1",
    "onnxruntime-gpu>=1.15.0,<1.19.0; platform_system != 'Darwin'",
]

[project.scripts]
ser = "anylabeling.app:main"
ser-publish = "anylabeling.services.auto_training.publish_dataset:main"
ser-train = "anylabeling.services.auto_training.train_with_registry:main"
ser-live = "anylabeling.services.auto_training.live_runtime:main"

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
    [
        { extra = "cpu" },
        { extra = "gpu-cu11" },
    ],
    [
        { extra = "gpu" },
        { extra = "gpu-cu11" },
    ],
]

# Tools settings -------------------------------------------------------------------------------------------------------
[tool.setuptools]  # configuration specific to the `setuptools` build backend.
packages = { find = { where = ["."], include = ["anylabeling*"], exclude = ["resources*"] } }

[tool.setuptools.dynamic]
version = {attr = "anylabeling.app_info.__version__"}

[tool.pytest.ini_options]
addopts = "--doctest-modules --durations=30 --color=yes"
markers = [
    "slow: skip slow tests unless --slow is set",
]
norecursedirs = [".git", "dist", "build"]

[tool.black]
line-length = 79
exclude = '''
/( \\
    \\.git
  | \\.hg
  | \\.mypy_cache
  | \\.tox
  | \\.venv
  | _build
  | buck-out
  | build
  | dist
  | tests/
  | anylabeling/resources/resources\\.py
)/
'''

[tool.flake8]
max-line-length = 79
max-complexity = 18
select = ["B", "C", "E", "F", "W", "T4", "B9"]
ignore = ["E203", "E266", "E501", "W503", "F403", "F401", "B905", "E402"]
exclude = [
  ".git",
  "__pycache__",
  "build",
  "dist",
  ".venv",
  "anylabeling/resources/resources.py"
]
